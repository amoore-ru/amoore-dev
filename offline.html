<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<title>Нет соединения · amoore</title>
<style>
:root{--bg:#0A0A0A;--fg:#F4F1E8;--dim:#9A968A;--gold1:#F6E08F;--gold2:#D4AF37;--gold3:#9A7A1C}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
main{max-width:360px}
.logo{font-size:72px;font-weight:700;line-height:1;margin:0 0 20px;background:linear-gradient(135deg,var(--gold1),var(--gold2) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:22px;margin:0 0 8px}
p{margin:0 0 28px;color:var(--dim);line-height:1.5}
button{font:inherit;font-weight:600;color:#1a1405;background:linear-gradient(135deg,var(--gold1),var(--gold2));border:0;border-radius:999px;padding:14px 32px;min-height:48px;cursor:pointer}
button:active{transform:scale(.97)}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">a.</div>
  <h1>Нет соединения</h1>
  <p>Проверьте интернет — страница откроется, как только связь появится.</p>
  <button type="button" onclick="location.reload()">Повторить</button>
</main>
<script>window.addEventListener('online',function(){location.reload()})</script>
</body>
</html>
